<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Salah Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #000; border-bottom: 3px solid #00ff00; }
        .navbar-brand { color: #00ff00 !important; font-weight: bold; font-size: 1.8rem; }
        .footer { background-color: #000; border-top: 2px solid #00ff00; padding: 30px 0; text-align: center; margin-top: 50px; }
        .btn-main { background-color: #00ff00; color: #000; padding: 10px 20px; text-decoration: none; border-radius: 5px; transition: 0.3s; border: none;}
        .btn-main:hover { background-color: #00cc00; color: #000; transform: scale(1.05); }
        .section-title { color: #00ff00; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
        .card-dark { background-color: #1f1f1f; border: 1px solid #333; color: #ddd; padding: 20px; border-radius: 8px; transition: 0.3s; height: 100%;}
        .card-dark:hover { border-color: #00ff00; transform: translateY(-5px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark p-3">
        <div class="container">
            <a class="navbar-brand" href="/">cyber-salah-security</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link text-white" href="/">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/journey">رحلتي</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/knowledge">المعرفة</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/hacking_tools">أدوات الاختراق</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/roadmaps">مسارات</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/connect">تواصل والخصوصية</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <div class="container">
            <h5 class="text-success">cyber-salah-security</h5>
            <p class="text-secondary m-0">حماية المعرفة هي بداية الأمان.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
